# 发布仓库工作流：每 3 小时刷新新闻与 SEC 申报流、重算 graph.json，然后部署到 GitHub Pages。
# 边表（edges.jsonl）与实体表由主仓库的 ai-deal-graph skill 维护，随 publish_site.sh 推送到 monitor/。
# 需要仓库 Secret：SEC_UA（SEC EDGAR 要求 User-Agent 含机构名与联系邮箱）。
name: Refresh data and publish
on:
  schedule:
    - cron: "17 */3 * * *"
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch news (Google News RSS + IR feeds)
        env:
          PRESS_UA: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/129.0 Safari/537.36"
        run: |
          python3 monitor/press_watch.py --feeds monitor/news_feeds.txt --since $(date -u -d '7 days ago' +%Y-%m-%d) \
            --out data/news_raw.jsonl --state monitor/press_state.json || true
      - name: Fetch SEC filings (last 30 days, all forms)
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
        run: |
          if [ -z "$SEC_UA" ]; then echo "::warning::SEC_UA secret not set; EDGAR step skipped"; exit 0; fi
          # 注意：SEC 对 GitHub 托管 runner 的 IP 段常返回 403；失败时 export 会沿用上一版申报列表并标记 stale
          python3 monitor/edgar_watch.py --entities monitor/entities.json --since $(date -u -d '60 days ago' +%Y-%m-%d) \
            --out data/filings_raw.jsonl --forms "8-K,8-K/A,6-K,424B2,424B5,FWP,10-Q,10-K,D" --items "" --cik-cache monitor/cik_cache.json || true
      - name: Export graph.json
        run: |
          python3 monitor/export_site_data.py --entities monitor/entities.json --edges monitor/edges.jsonl --metrics monitor/metrics.json \
            --news data/news_raw.jsonl --filings data/filings_raw.jsonl --commentary monitor/commentary.json --fallback data/graph.json --out data/graph.json --archive data/archive \
            --monitor-note "github-actions $(date -u +%Y-%m-%dT%H:%MZ)"
      - name: Commit refreshed data
        run: |
          git config user.name "deal-graph-bot"; git config user.email "deal-graph-bot@users.noreply.github.com"
          git add data/graph.json data/archive monitor/press_state.json monitor/cik_cache.json
          git diff --cached --quiet || git commit -m "Refresh $(date -u +%Y-%m-%d\ %H:%M) UTC"
          git push || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
